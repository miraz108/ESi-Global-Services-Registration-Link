<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESi Global Services — Information Form</title>
<style>
:root{
  --navy:#0a2647;      /* deep blue */
  --navy-dark:#061a33;
  --red:#8b0000;        /* blood red */
  --red-dark:#6e0000;
  --white:#ffffff;
  --light:#eef2f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:#202b33;
  font-family:Arial,sans-serif;
  background-color:var(--light);
  background-image:
    linear-gradient(rgba(10,38,71,0.93), rgba(10,38,71,0.93)),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='700' viewBox='0 0 1000 700'><g fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='0.22'><g transform='translate(60,60)'><path d='M0,50 Q15,5 30,50 Z'/><path d='M22,50 Q42,-8 62,50 Z'/><path d='M54,50 Q74,10 94,50 Z'/><path d='M86,50 Q101,22 116,50 Z'/><line x1='-8' y1='50' x2='124' y2='50'/></g><text x='40' y='140' font-size='30' opacity='0.7'>🇦🇺</text><g transform='translate(300,70)'><line x1='20' y1='95' x2='20' y2='12'/><ellipse cx='20' cy='34' rx='11' ry='6'/><line x1='20' y1='12' x2='20' y2='-3'/><line x1='6' y1='95' x2='34' y2='95'/></g><text x='300' y='150' font-size='30' opacity='0.7'>🇨🇦</text><g transform='translate(550,55)'><path d='M0,65 L25,18 L45,42 L70,8 L100,65 Z'/></g><text x='580' y='150' font-size='30' opacity='0.7'>🇳🇿</text><g transform='translate(770,60)'><path d='M8,95 L8,22 L13,10 L18,22 L18,95'/><path d='M32,95 L32,22 L37,10 L42,22 L42,95'/><line x1='18' y1='58' x2='32' y2='58'/></g><text x='810' y='150' font-size='30' opacity='0.7'>🇲🇾</text><g transform='translate(150,340)'><rect x='0' y='28' width='22' height='62'/><circle cx='11' cy='16' r='9'/><path d='M-2,6 L11,-10 L24,6 Z'/></g><text x='60' y='460' font-size='30' opacity='0.7'>🇬🇧</text><g transform='translate(420,350)'><rect x='0' y='22' width='16' height='68'/><path d='M0,22 L8,0 L16,22 Z'/><circle cx='55' cy='78' r='6'/><circle cx='66' cy='68' r='6'/><circle cx='77' cy='78' r='6'/></g><text x='400' y='470' font-size='30' opacity='0.7'>🇮🇪</text><g transform='translate(700,350) scale(0.9)'><path d='M0,60 Q15,5 30,60 Z'/><path d='M22,60 Q42,-8 62,60 Z'/><line x1='-8' y1='60' x2='68' y2='60'/></g><text x='860' y='460' font-size='26' opacity='0.6'>🇦🇺</text><text x='150' y='620' font-size='26' opacity='0.5'>🇨🇦</text><text x='430' y='630' font-size='26' opacity='0.5'>🇲🇾</text><text x='700' y='610' font-size='26' opacity='0.5'>🇬🇧</text></g></svg>");
  background-repeat:no-repeat, repeat;
  background-size:cover, 1000px 700px;
  background-attachment:fixed, fixed;
}

.header{
  background:linear-gradient(135deg,var(--red) 0 44%,var(--white) 44%);
  padding:20px 24px;display:flex;align-items:center;gap:20px;
  border-bottom:5px solid var(--navy);
}
.brand{background:var(--white);padding:12px 18px;border-radius:8px;font-size:26px;font-weight:800;color:var(--navy)}
.brand span{color:var(--red)}
.title{color:var(--white);font-size:26px;font-weight:800;text-transform:uppercase}

.destinations{
  background:rgba(6,26,51,0.55);
  border-bottom:1px solid rgba(255,255,255,0.15);
  padding:10px 24px;
  display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;
}
.destinations span{
  color:var(--white);font-size:13px;font-weight:600;letter-spacing:.2px;
  display:flex;align-items:center;gap:6px;
}
.destinations .flag{font-size:16px;line-height:1}

.wrap{max-width:1050px;margin:22px auto;padding:0 14px}
.card{background:var(--white);border-radius:12px;box-shadow:0 5px 22px #0002;padding:24px}

h2{color:var(--navy);border-bottom:3px solid var(--red);padding-bottom:8px}
h3{color:var(--navy);margin-top:26px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}

label{font-weight:700;font-size:13px;display:block;margin-bottom:5px;color:var(--navy-dark)}
input,textarea,select{width:100%;padding:10px;border:1px solid #c3ccd6;border-radius:6px;font-size:15px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)}
textarea{min-height:70px;resize:vertical}

.checks{display:flex;flex-wrap:wrap;gap:10px}
.checks label{font-weight:400;background:var(--light);padding:8px 10px;border-radius:6px}
.checks input{width:auto}

table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #d4dbe2;padding:7px}
th{background:var(--light);color:var(--navy-dark)}

button{background:var(--navy);color:var(--white);border:0;padding:13px 24px;border-radius:7px;font-weight:700;font-size:16px;cursor:pointer;transition:background .15s ease}
button:hover{background:var(--navy-dark)}
button:disabled{opacity:.6;cursor:not-allowed}

.actions{margin-top:24px;text-align:center}
.msg{display:none;margin-top:15px;padding:12px;border-radius:7px}
.ok{background:#e6f0e9;color:#1b5e34;border:1px solid #b7d6c1}
.err{background:#fbe8e6;color:var(--red-dark);border:1px solid #e6b8b3}
.small{font-size:12px;color:#607078}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .header{display:block}
  .title{margin-top:10px}
  .card{padding:16px}
  table{font-size:12px}
  .destinations{gap:8px 14px;padding:8px 14px}
  .destinations span{font-size:12px}
}
</style>
</head>
<body>
<div class="header">
  <div class="title">Information Form</div>
  <div class="brand"><span>ESi</span> GLOBAL SERVICES</div>
</div>
<div class="destinations">
  <span><span class="flag">🇦🇺</span> Australia</span>
  <span><span class="flag">🇨🇦</span> Canada</span>
  <span><span class="flag">🇳🇿</span> New Zealand</span>
  <span><span class="flag">🇲🇾</span> Malaysia</span>
  <span><span class="flag">🇬🇧</span> UK</span>
  <span><span class="flag">🇮🇪</span> Ireland</span>
</div>

<div class="wrap"><div class="card">
<form id="form">
  <div class="grid">
    <div><label>Ref</label><input name="ref"></div>
    <div><label>Date of Registration</label><input type="date" name="registrationDate"></div>
    <div class="full"><h2>PERSONAL DETAILS</h2></div>
    <div><label>Full Name *</label><input name="fullName" required></div>
    <div><label>Cell No *</label><input name="cellNo" required></div>
    <div><label>Email *</label><input type="email" name="email" required></div>
    <div><label>Date of Birth</label><input type="date" name="dateOfBirth"></div>
    <div class="full"><label>Present Address</label><textarea name="presentAddress"></textarea></div>
    <div><label>IELTS/PTE/OTHERS Score (If any)</label><input name="score"></div>
  </div>

  <h2>EDUCATIONAL QUALIFICATION</h2>
  <table><thead><tr><th>Qualification</th><th>Subject/Major</th><th>Year</th><th>Result</th><th>Institution</th></tr></thead>
  <tbody id="edu"></tbody></table>

  <h2>STUDY PREFERENCES</h2>
  <label>Preferred Destination</label>
  <div class="checks">
    <label><input type="checkbox" name="preferredDestination" value="Australia"> Australia</label>
    <label><input type="checkbox" name="preferredDestination" value="Canada"> Canada</label>
    <label><input type="checkbox" name="preferredDestination" value="UK"> UK</label>
    <label><input type="checkbox" name="preferredDestination" value="USA"> USA</label>
  </div>
  <br>
  <label>Purpose of Visit</label>
  <div class="checks">
    <label><input type="checkbox" name="purposeOfVisit" value="Study Abroad"> Study Abroad</label>
    <label><input type="checkbox" name="purposeOfVisit" value="Skilled Migration"> Skilled Migration</label>
    <label><input type="checkbox" name="purposeOfVisit" value="Visit/Tourist Visa"> Visit/Tourist Visa</label>
    <label><input type="checkbox" name="purposeOfVisit" value="PTE"> PTE</label>
  </div>
  <div class="grid" style="margin-top:14px">
    <div class="full"><label>Preferred Institutions</label><input name="preferredInstitutions"></div>
    <div class="full"><label>Preferred Degree/Subject</label><input name="preferredDegree"></div>
    <div><label>Did you apply to Study Abroad before?</label>
      <select name="appliedBefore"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
    <div><label>Previous Country</label><input name="previousCountry"></div>
    <div><label>Previous Institute</label><input name="previousInstitute"></div>
    <div><label>Previous Program</label><input name="previousProgram"></div>
  </div>

  <h2>OTHER INFORMATION</h2>
  <label>How do you know about us?</label>
  <div class="checks">
    <label><input type="checkbox" name="knowAboutUs" value="Newspaper"> Newspaper</label>
    <label><input type="checkbox" name="knowAboutUs" value="Relative/Friends"> Relative/Friends</label>
    <label><input type="checkbox" name="knowAboutUs" value="Google"> Google</label>
    <label><input type="checkbox" name="knowAboutUs" value="Facebook"> Facebook</label>
    <label><input type="checkbox" name="knowAboutUs" value="Other"> Other</label>
  </div>
  <div class="grid" style="margin-top:14px">
    <div><label>Study Gap (if any)</label><select name="studyGap"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
    <div><label>Reason</label><input name="studyGapReason"></div>
    <div class="full"><label>Work Experience (if any)</label><textarea name="workExperience"></textarea></div>
    <div><label>Who will be your Sponsor?</label><input name="sponsor"></div>
    <div><label>Approximate Fund</label><input name="approximateFund"></div>
  </div>

  <div class="actions">
    <button id="submitBtn" type="submit">Submit Information Form</button>
    <div class="small">Your submitted form will be recorded in our system.</div>
    <div id="ok" class="msg ok"></div><div id="err" class="msg err"></div>
  </div>
</form>
</div></div>

<script>
// ⚠️ এখানে আপনার Google Apps Script Web App URL বসান (Deploy > Web app করার পর যে URL পাবেন)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyFV7V75m1SZMZ8PTpvGoQnoIXAc3SGkOZVRrL1W0h8fVz3MpxWKQWNeeNkRCMj7PA5w/exec";

const edu = document.getElementById('edu');
for(let i=0;i<6;i++){
  const tr=document.createElement('tr');
  ['qualification','subject','year','result','institution'].forEach(k=>{
    const td=document.createElement('td');
    td.innerHTML=`<input name="${k}_${i}" ${k==='year'?'inputmode="numeric"':''}>`;
    tr.appendChild(td);
  });
  edu.appendChild(tr);
}
document.querySelector('[name=registrationDate]').valueAsDate=new Date();

function vals(name){
  return [...document.querySelectorAll(`[name="${name}"]:checked`)].map(x=>x.value);
}
function collect(){
  const f=document.getElementById('form');
  const d=Object.fromEntries(new FormData(f).entries());
  d.preferredDestination=vals('preferredDestination');
  d.purposeOfVisit=vals('purposeOfVisit');
  d.knowAboutUs=vals('knowAboutUs');
  d.qualifications=[];
  for(let i=0;i<6;i++) d.qualifications.push({
    qualification:d[`qualification_${i}`], subject:d[`subject_${i}`], year:d[`year_${i}`],
    result:d[`result_${i}`], institution:d[`institution_${i}`]
  });
  return d;
}

document.getElementById('form').addEventListener('submit', function(e){
  e.preventDefault();
  const btn=document.getElementById('submitBtn'), ok=document.getElementById('ok'), err=document.getElementById('err');
  ok.style.display='none'; err.style.display='none'; btn.disabled=true; btn.textContent='Submitting...';

  if(SCRIPT_URL.includes("PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")){
    err.textContent = "প্রথমে কোডে আপনার Google Apps Script URL বসান।";
    err.style.display='block'; btn.disabled=false; btn.textContent='Submit Information Form';
    return;
  }

  const payload = collect();

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(r => {
    if(r.result === 'error') throw new Error(r.message || 'Submission failed');
    ok.textContent = (r.message || 'Submitted successfully.') + (r.reference ? ' Reference: ' + r.reference : '');
    ok.style.display='block';
    document.getElementById('form').reset();
    document.querySelector('[name=registrationDate]').valueAsDate=new Date();
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  })
  .catch(e => {
    err.textContent = e.message || 'Submission failed. Please try again.';
    err.style.display='block';
  })
  .finally(() => {
    btn.disabled=false; btn.textContent='Submit Information Form';
  });
});
</script>
</body>
</html>
